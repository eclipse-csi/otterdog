# Read the Docs keeps serving otterdog.readthedocs.io while the documentation moves to GitHub Pages
# (.github/workflows/docs.yml): the same strict Zensical build, staged by docs_site.py, whose site_url is the
# READTHEDOCS_CANONICAL_URL set by Read the Docs. See
# https://docs.readthedocs.com/platform/stable/build-customization.html#override-the-build-process

version: "2"

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  commands:
    - python -m pip install --disable-pip-version-check "poetry==2.4.1"
    - python -m poetry config virtualenvs.in-project true
    - python -m poetry install --only=docs --no-root
    - .venv/bin/python docs_site.py build --strict
    - mkdir -p "$READTHEDOCS_OUTPUT/html" && cp -R site/. "$READTHEDOCS_OUTPUT/html/"
