apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: otterdog
requires:
- path: ./dependencies

build:
  local:
    # Local dev against a local cluster (minikube): build the image locally and do
    # NOT push it to a remote registry. Skaffold loads it into the cluster instead.
    push: false
  artifacts:
    - image: ghcr.io/eclipse-csi/otterdog
      context: .
      docker:
        buildArgs:
          version: '{{cmd "poetry" "version" "-s" }}'
        dockerfile: docker/Dockerfile


profiles:
  # Local development without exposing the otterdog service using tailscale.
  - name: dev
    deploy:
      helm:
        hooks: &dev-hooks
          before:
            - host:
                command: ["sh", "-c", "if [ ! -f ./values.yaml ]; then echo 'Error: Please create the `./dev-values.yaml`'; exit 1; fi"]
          after:
            - host:
                command: ["sh", "-c", "while ! kubectl rollout status deployment/otterdog -n otterdog --timeout=10s 2>/dev/null; do sleep 10; done && until kubectl exec -n otterdog deploy/otterdog -- /app/init-webapp localhost 5000; do sleep 2; done"]
        releases:
          - name: otterdog
            remoteChart: eclipse-csi/otterdog
            valuesFiles: &dev-valuesFiles
              - ./dev/dev-values.yaml
              - ./values.yaml

  - name: dev-local
    deploy:
      helm:
        hooks: *dev-hooks
        releases:
          - name: otterdog
            chartPath: ../helm-charts/charts/otterdog
            valuesFiles: *dev-valuesFiles


  # Local development with tailscale.
  - name: dev-tunnel
    deploy:
      helm:
        hooks: &tunnel-hooks
          before:
            - host:
                command: ["sh", "-c", "if [ ! -f ./values.yaml ]; then echo 'Error: Please create the `./values.yaml`'; exit 1; fi"]
            - host:
                command: ["sh", "-c", "if [ -z \"$TS_CLIENT_ID\" ]; then echo 'Error: TS_CLIENT_ID is not set'; exit 1; fi"]
            - host:
                command: ["sh", "-c", "if [ -z \"$TS_CLIENT_SECRET\" ]; then echo 'Error: TS_CLIENT_SECRET is not set'; exit 1; fi"]
            - host:
                command: ["sh", "-c", "if [ -z \"$TS_DNS\" ]; then echo 'Error: TS_DNS is not set'; exit 1; fi"]
          after:
              - host:
                  command: ["sh", "-c", "while ! kubectl rollout status deployment/otterdog -n otterdog --timeout=10s 2>/dev/null; do sleep 10; done && until kubectl exec -n otterdog deploy/otterdog -- /app/init-webapp localhost 5000; do sleep 2; done"]
        releases:
          - &dependency-track-release
            name: dependency-track
            remoteChart: dependency-track/dependency-track
            version: 1.3.0
            namespace: otterdog
            createNamespace: true
            valuesFiles:
              - ./dev/dev-values-tunnel.yaml
            setValueTemplates:
              ingress.hostname: sbom.{{.TS_DNS}}
              ingress.tls[0].hosts[0]: sbom.{{.TS_DNS}}
          - &tailscale-release
            name: otterdog-tailscale-operator
            remoteChart: tailscale/tailscale-operator
            namespace: tailscale
            createNamespace: true
            setValueTemplates:
              oauth.clientId: "{{.TS_CLIENT_ID}}"
              oauth.clientSecret: "{{.TS_CLIENT_SECRET}}"
          - name: otterdog
            remoteChart: eclipse-csi/otterdog
            namespace: otterdog
            createNamespace: true
            valuesFiles: &tunnel-valuesFiles
              - ./dev/dev-values.yaml
              - ./dev/dev-values-tunnel.yaml
              - ./values.yaml
            setValueTemplates: &otterdog-tunnel-setValues
              ingress.tls[0].hosts[0]: otterdog.{{.TS_DNS}}


  # Same as "dev-tunnel" but uses the local Helm chart checkout for the otterdog release.
  # Assumes the helm-charts repo is checked out next to the otterdog repo:
  #   <workspace>/otterdog        (this repo)
  #   <workspace>/helm-charts     (chart source)
  # Run `helm dependency build ../helm-charts/charts/otterdog` once before the first deploy.
  - name: dev-tunnel-local
    deploy:
      helm:
        hooks: *tunnel-hooks
        releases:
          - *dependency-track-release
          - *tailscale-release
          - name: otterdog
            chartPath: ../helm-charts/charts/otterdog
            namespace: otterdog
            createNamespace: true
            valuesFiles: *tunnel-valuesFiles
            setValueTemplates: *otterdog-tunnel-setValues


  # Local development with ngrok (alternative to tailscale).
  # Required env vars: NGROK_API_KEY, NGROK_AUTHTOKEN, NGROK_DOMAIN
  # NGROK_DOMAIN must be the exact reserved domain (e.g. a free otterdog-<hash>.ngrok-free.dev
  # domain, or a custom domain you own): free ngrok domains do NOT support subdomains, so no
  # "otterdog." prefix is added. Dependency Track is not exposed via ngrok; use
  # `kubectl port-forward` to reach it (see docs/developing_otterdog/testing.md).
  - name: dev-ngrok
    deploy:
      helm:
        hooks: &ngrok-hooks
          before:
            - host:
                command: ["sh", "-c", "if [ ! -f ./values.yaml ]; then echo 'Error: Please create the `./values.yaml`'; exit 1; fi"]
            - host:
                command: ["sh", "-c", "if [ -z \"$NGROK_API_KEY\" ]; then echo 'Error: NGROK_API_KEY is not set'; exit 1; fi"]
            - host:
                command: ["sh", "-c", "if [ -z \"$NGROK_AUTHTOKEN\" ]; then echo 'Error: NGROK_AUTHTOKEN is not set'; exit 1; fi"]
            - host:
                command: ["sh", "-c", "if [ -z \"$NGROK_DOMAIN\" ]; then echo 'Error: NGROK_DOMAIN is not set'; exit 1; fi"]
            # Helm's `--set` replaces whole lists instead of merging them, so setting only
            # ingress.hosts[0].host via setValueTemplates silently drops the chart's default
            # ingress.hosts[0].paths (see https://helm.sh/docs/chart_template_guide/values_files/).
            # Generate a small values file with host+paths together instead.
            - host:
                command: ["sh", "-c", "echo \"ingress: {hosts: [{host: $NGROK_DOMAIN, paths: [{path: /, pathType: ImplementationSpecific}]}]}\" > ./dev/.dev-values-ngrok-host.yaml"]
          after:
              - host:
                  command: ["sh", "-c", "while ! kubectl rollout status deployment/otterdog -n otterdog --timeout=10s 2>/dev/null; do sleep 10; done && until kubectl exec -n otterdog deploy/otterdog -- /app/init-webapp localhost 5000; do sleep 2; done && echo \"Otterdog is reachable at: https://$NGROK_DOMAIN\""]
        releases:
          - &dependency-track-ngrok-release
            name: dependency-track
            remoteChart: dependency-track/dependency-track
            version: 1.3.0
            namespace: otterdog
            createNamespace: true
          - &ngrok-release
            name: otterdog-ngrok-operator
            remoteChart: ngrok/ngrok-operator
            namespace: ngrok
            createNamespace: true
            setValueTemplates:
              credentials.apiKey: "{{.NGROK_API_KEY}}"
              credentials.authtoken: "{{.NGROK_AUTHTOKEN}}"
          - name: otterdog
            remoteChart: eclipse-csi/otterdog
            namespace: otterdog
            createNamespace: true
            valuesFiles: &ngrok-valuesFiles
              - ./dev/dev-values.yaml
              - ./dev/dev-values-ngrok.yaml
              - ./values.yaml
              - ./dev/.dev-values-ngrok-host.yaml

  # Same as "dev-ngrok" but uses the local Helm chart checkout for the otterdog release.
  - name: dev-ngrok-local
    deploy:
      helm:
        hooks: *ngrok-hooks
        releases:
          - *dependency-track-ngrok-release
          - *ngrok-release
          - name: otterdog
            chartPath: ../helm-charts/charts/otterdog
            namespace: otterdog
            createNamespace: true
            valuesFiles: *ngrok-valuesFiles
