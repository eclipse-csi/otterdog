# Documentation site: a strict Zensical build of docs/ (staged by docs_site.py) for every change of the documentation,
# deployed to GitHub Pages from main, with a preview of every pull request, as for eclipse-cbi/cbi-website.
#
# - build: only reads the repository and uses no secret, also for the pull requests from forks.
# - preview: publishes the site of a pull request on the GitHub Pages of eclipse-csi/otterdog-website-preview (branch
#   gh-pages-preview, one directory pr-preview/pr-<number>/ per pull request) and links it from a comment. It runs in
#   the pull request itself, so the secret GH_PREVIEW_TOKEN is only available to the pull requests from branches of
#   this repository: the ones from forks and from Dependabot are built without a preview. docs-preview.yml removes the
#   preview when the pull request is closed.
# - deploy: the only job that may publish the site, from main, in the github-pages environment.
#
# Setup, in the otterdog configuration of eclipse-csi: GitHub Pages of this repository built by a workflow
# (gh_pages_build_type "workflow"), the environments github-pages (main) and pull-request-preview (all branches), the
# secret GH_PREVIEW_TOKEN (a token that may push to eclipse-csi/otterdog-website-preview: contents: write on that
# repository only), and the repository otterdog-website-preview publishing its branch gh-pages-preview with GitHub
# Pages (gh_pages_build_type "legacy").
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "zensical.toml"
      - "docs_site.py"
      - "docs_playground.py"
      # included by the reference (pymdownx.snippets)
      - "otterdog/resources/defaults/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "zensical.toml"
      - "docs_site.py"
      - "docs_playground.py"
      - "otterdog/resources/defaults/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

env:
  PYTHON_VERSION: '3.12'
  # where the previews are published (deploy-repository, preview-branch and umbrella-dir of rossjrw/pr-preview-action,
  # also in docs-preview.yml): the site of a pull request is built for its url
  PREVIEW_REPOSITORY: eclipse-csi/otterdog-website-preview
  PREVIEW_BRANCH: gh-pages-preview
  UMBRELLA_DIR: pr-preview
  # the GitHub Pages of eclipse-csi are served at csi.eclipse.dev (eclipse-csi.github.io redirects there)
  PREVIEW_PAGES_URL: csi.eclipse.dev/otterdog-website-preview
  PREVIEW_BASE_URL: https://csi.eclipse.dev/otterdog-website-preview/pr-preview
  # marks the comment linking the preview on a pull request, updated by every deployment and by the removal
  COMMENT_MARKER: "<!-- otterdog-docs-preview -->"

# Runs on main share the group "pages": one at a time, never cancelled (a deployment in progress always completes, a
# newer run replaces the one waiting). A pull request gets its own group, a newer commit cancels the run of the
# previous one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # no cache: this workflow publishes what it builds. The docs group of poetry.lock, with the hashes of every file,
      # installed from wheels only: no setup script of a package runs during the installation.
      - name: Install Zensical (the locked docs group, hash-checked wheels)
        run: |
          python docs_site.py requirements > "$RUNNER_TEMP/docs-requirements.txt"
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/docs-requirements.txt"
      - name: Build the site (staged by docs_site.py; strict, broken links and anchors fail)
        if: github.event_name != 'pull_request'
        run: python docs_site.py build --strict
      - name: Build the preview of the pull request
        if: github.event_name == 'pull_request'
        env:
          SITE_URL: ${{ env.PREVIEW_BASE_URL }}/pr-${{ github.event.pull_request.number }}/
          DOCS_PREVIEW_PR: ${{ github.event.pull_request.number }}
        run: python docs_site.py build --strict
      - name: Upload the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 7
          if-no-files-found: error
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  preview:
    name: publish the preview
    needs: build
    # the pull requests from forks have no access to the secret
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one deployment or removal (docs-preview.yml) at a time per pull request
    concurrency:
      group: docs-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      # the comment linking the preview
      pull-requests: write
    environment:
      name: pull-request-preview
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      # inside the concurrency group of the removal: a pull request closed meanwhile gets no preview back
      - name: Check that the pull request is still open at this commit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_TOKEN: ${{ secrets.GH_PREVIEW_TOKEN != '' }}
        with:
          script: |
            if (process.env.HAS_TOKEN !== "true") {
              core.notice("GH_PREVIEW_TOKEN is not available to this run (not set, or Dependabot): no preview.");
              return;
            }
            const event = context.payload.pull_request;
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: event.number });
            if (pull.state !== "open" || pull.head.sha !== event.head.sha) {
              core.notice(`#${event.number} is closed or has a newer commit than ${event.head.sha}: no preview.`);
              return;
            }
            core.setOutput("publish", "true");
      # rossjrw/pr-preview-action needs a checkout, the job runs nothing from it
      - if: steps.check.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the preview
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: preview-site
      - name: Publish the preview
        id: preview
        if: steps.check.outputs.publish == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: deploy
          pr-number: ${{ github.event.pull_request.number }}
          source-dir: preview-site
          deploy-repository: ${{ env.PREVIEW_REPOSITORY }}
          preview-branch: ${{ env.PREVIEW_BRANCH }}
          umbrella-dir: ${{ env.UMBRELLA_DIR }}
          # the url of the comment and of the environment, else eclipse-csi.github.io/otterdog-website-preview
          pages-base-url: ${{ env.PREVIEW_PAGES_URL }}
          token: ${{ secrets.GH_PREVIEW_TOKEN }}
          deploy-commit-message: Deploy the preview of pull request ${{ github.event.pull_request.number }}
          # the comment is written below, without a QR code service
          comment: false
          qr-code: false
      - name: Link the preview from the pull request
        if: steps.check.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        with:
          script: |
            const { PREVIEW_URL, COMMENT_MARKER } = process.env;
            const event = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              COMMENT_MARKER,
              `:book: The documentation of this pull request is previewed at ${PREVIEW_URL}`,
              "",
              `Built from ${event.head.sha} by [this run](${runUrl}), updated by every new commit ` +
                "(GitHub Pages may take a minute to publish it). The preview is removed when the pull request is closed.",
            ].join("\n");
            const issue = { ...context.repo, issue_number: event.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(
              (comment) => comment.user.login === "github-actions[bot]" && comment.body.startsWith(COMMENT_MARKER),
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the only job that writes anything: the Pages deployment (pages) and the OIDC token proving its origin (id-token)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
