# Documentation site: a strict Zensical build of docs/ (staged by docs_site.py) for every change of the documentation,
# deployed to GitHub Pages from main. The build job only reads the repository and uses no secret, also for the pull
# requests from forks: it uploads their site as the artifact docs-site, which docs-preview.yml publishes once this
# workflow completes. The deploy job alone may publish the site, in the github-pages environment.
#
# Repository setup, once: Settings > Pages > Build and deployment > Source: "GitHub Actions" (gh_pages_build_type
# "workflow" in the otterdog configuration of the organization).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "zensical.toml"
      - "docs_site.py"
      - "docs_playground.py"
      # included by the reference (pymdownx.snippets)
      - "otterdog/resources/defaults/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "zensical.toml"
      - "docs_site.py"
      - "docs_playground.py"
      - "otterdog/resources/defaults/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '2.4.1'
  # where docs-preview.yml publishes the preview of a pull request (deploy-repository, preview-branch and umbrella-dir
  # of rossjrw/pr-preview-action): the site is built for this url
  PREVIEW_BASE_URL: https://eclipse-csi.github.io/otterdog-website-preview/pr-preview

# Runs on main share the group "pages": one at a time, never cancelled (a deployment in progress always completes, a
# newer run replaces the one waiting). A pull request gets its own group, a newer commit cancels the build of the
# previous one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-in-project: true
          version: ${{ env.POETRY_VERSION }}
      # no cache: this workflow publishes what it builds
      - name: Install Zensical (the locked docs group)
        run: poetry install --only=docs --no-root
      - name: Build the site (staged by docs_site.py; strict, broken links and anchors fail)
        if: github.event_name != 'pull_request'
        run: poetry run python docs_site.py build --strict
      - name: Build the preview of the pull request
        if: github.event_name == 'pull_request'
        env:
          SITE_URL: ${{ env.PREVIEW_BASE_URL }}/pr-${{ github.event.pull_request.number }}/
          DOCS_PREVIEW_PR: ${{ github.event.pull_request.number }}
        run: poetry run python docs_site.py build --strict
      - name: Upload the preview (published by docs-preview.yml)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 7
          if-no-files-found: error
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the only job that writes anything: the Pages deployment (pages) and the OIDC token proving its origin (id-token)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
