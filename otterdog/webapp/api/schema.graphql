schema {
    query: Query
}

type Project {
    github_id: String!
    project_name: String!
    config: Configuration!
}

type Configuration {
    github_id: String!
    settings: OrganizationSettings!
    code_security_configurations: [CodeSecurityConfiguration]
    repositories(filter: String): [Repository]
}

type CodeSecurityConfiguration {
    name: String
    description: String
    code_security: String
    secret_protection: String
    dependency_graph: String
    dependency_graph_autosubmit_action: String
    dependency_graph_autosubmit_action_labeled_runners: Boolean
    dependabot_alerts: String
    dependabot_security_updates: String
    dependabot_reachability: String
    dependabot_delegated_alert_dismissal: String
    code_scanning_default_setup: String
    code_scanning_default_setup_runner_type: String
    code_scanning_default_setup_runner_label: String
    code_scanning_allow_advanced: Boolean
    code_scanning_delegated_alert_dismissal: String
    secret_scanning: String
    secret_scanning_push_protection: String
    secret_scanning_delegated_bypass: String
    secret_scanning_delegated_bypass_reviewers: [String]
    secret_scanning_validity_checks: String
    secret_scanning_non_provider_patterns: String
    secret_scanning_generic_secrets: String
    secret_scanning_generic_secrets_push_protection: String
    secret_scanning_delegated_alert_dismissal: String
    secret_scanning_extended_metadata: String
    private_vulnerability_reporting: String
    enforcement: String
    default_for_new_repos: String
}

type Repository {
    name: String
    description: String
    homepage: String
    private: Boolean
    has_discussions: Boolean
    has_issues: Boolean
    has_projects: Boolean
    has_wiki: Boolean
    is_template: Boolean
    template_repository: String
    topics: [String]
    default_branch: String
    allow_rebase_merge: Boolean
    allow_merge_commit: Boolean
    allow_squash_merge: Boolean
    allow_auto_merge: Boolean
    delete_branch_on_merge: Boolean
    allow_update_branch: Boolean
    squash_merge_commit_title: String
    squash_merge_commit_message: String
    merge_commit_title: String
    merge_commit_message: String
    archived: Boolean
    allow_forking: Boolean
    web_commit_signoff_required: Boolean
    secret_scanning: String
    secret_scanning_push_protection: String
    dependabot_alerts_enabled: Boolean
    dependabot_security_updates_enabled: Boolean
    private_vulnerability_reporting_enabled: Boolean
    code_scanning_default_setup_enabled: Boolean
    code_scanning_default_query_suite: String
    code_scanning_default_languages: [String]
    code_security_configuration: String
    gh_pages_build_type: String
    gh_pages_source_branch: String
    gh_pages_source_path: String
    gh_pages_visibility: String
    gh_pages_cname: String
    gh_pages_https_enforced: Boolean
}

type OrganizationSettings {
    name: String
    plan: String
    description: String
    email: String
    location: String
    company: String
    billing_email: String
    twitter_username: String
    blog: String
    has_discussions: Boolean
    discussion_source_repository: String
    has_organization_projects: Boolean
    default_branch_name: String
    default_repository_permission: String
    two_factor_requirement: Boolean
    web_commit_signoff_required: Boolean
    default_code_security_configurations_disabled: Boolean
    members_can_create_private_repositories: Boolean
    members_can_create_public_repositories: Boolean
    members_can_fork_private_repositories: Boolean
    deploy_keys_enabled_for_repositories: Boolean
    members_can_create_public_pages: Boolean
    members_can_create_private_pages: Boolean
    members_can_change_repo_visibility: Boolean
    members_can_delete_repositories: Boolean
    members_can_delete_issues: Boolean
    members_can_create_teams: Boolean
    readers_can_create_discussions: Boolean
    packages_containers_public: Boolean
    packages_containers_internal: Boolean
    members_can_change_project_visibility: Boolean
    security_managers: [String]
}

type Query {
    projects(filter: String): [Project]!
}
