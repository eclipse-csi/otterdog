# the Eclipse colors, the hero of the home page and the banner of the previews of pull requests
extra_css = ["assets/theme.css"]

[project.extra]
# url of the otterdog dashboard whose playground is linked below the complete jsonnet examples (docs_playground.py)
# and from the hero of the home page; the environment variable OTTERDOG_URL overrides it, empty to omit these links
otterdog_url = "https://otterdog.eclipse.org"

# the links of the footer
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/eclipse-csi/otterdog"
name = "otterdog on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/otterdog/"
name = "otterdog on PyPI"

[[project.extra.social]]
icon = "lucide/layout-dashboard"
link = "https://otterdog.eclipse.org"
name = "the otterdog dashboard of the Eclipse Foundation"

[project.theme]
# main.html: the hero of the home page and the banner of a preview; partials/tabs.html: the sections of the active
# tab as a second row of tabs
custom_dir = "docs-theme"
# the official artwork of otterdog (eclipse-csi/.github, artwork/eclipse-otterdog), copied unaltered as its brand
# guidelines require: the emblem is drawn on a white disc by docs/assets/theme.css, its blue being too dark for the
# purple of the header
logo = "assets/images/otterdog-emblem.png"
favicon = "assets/images/favicon-32x32.png"
icon.repo = "fontawesome/brands/github"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# the colors of the Eclipse Foundation, set by docs/assets/theme.css
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
tables = {}
# the default anchors of the toc extension: the playground and the webapp link to them (docs_playground._slugify)
toc.permalink = true
toc.title = "Page"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
# `--8<-- "path"` reads a file of the repository (docs_site.py sets base_path to its root), a missing one fails
pymdownx.snippets.check_paths = true
# extra must be loaded before superfences
pymdownx.extra = {}
pymdownx.superfences.custom_fences = [
  # ```mermaid blocks, rendered by the theme's own mermaid integration
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.details = {}
pymdownx.caret = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tilde = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.tabbed.alternate_style = true
