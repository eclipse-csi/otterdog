# Documentation site, built by Zensical: `make docs` builds it strictly into site/, `make docs-serve` previews it. It is
# published on GitHub Pages from main, with a preview of the pull requests from branches of the repository
# (.github/workflows/docs.yml). Zensical runs no hooks: docs_site.py stages the pages first (.docs-site/:
# the links to the playground below the jsonnet examples, docs_playground.py) with a copy of this file completed by the
# environment (SITE_URL or READTHEDOCS_CANONICAL_URL, OTTERDOG_URL, DOCS_PREVIEW_PR).
[project]
site_name = "otterdog"
site_description = "Manage GitHub organizations at scale"
# the GitHub Pages of eclipse-csi are served at csi.eclipse.dev (eclipse-csi.github.io redirects there)
site_url = "https://csi.eclipse.dev/otterdog/"
repo_url = "https://github.com/eclipse-csi/otterdog"
repo_name = "eclipse-csi/otterdog"
edit_uri = "edit/main/docs/"
copyright = "otterdog is an Eclipse Foundation project licensed under the Eclipse Public License 2.0"

